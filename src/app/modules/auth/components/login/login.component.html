<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        Acesse sua conta
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Ou
        <a [routerLink]="['/register']" class="font-medium text-indigo-600 hover:text-indigo-500">
          crie uma nova conta
        </a>
      </p>
    </div>
    
    <form class="mt-8 space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="rounded-md shadow-sm space-y-4">
        <!-- Email -->
        <div>
          <label for="email-address" class="sr-only">E-mail</label>
          <input id="email-address" name="email" type="email" autocomplete="email" formControlName="email"
            class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
            placeholder="E-mail" required>
          <div *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="text-red-500 text-xs mt-1">
            <div *ngIf="email?.errors?.['required']">E-mail é obrigatório</div>
            <div *ngIf="email?.errors?.['email']">Por favor, insira um e-mail válido</div>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="sr-only">Senha</label>
          <input id="password" name="password" type="password" formControlName="password"
            class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
            placeholder="Senha" required>
          <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="text-red-500 text-xs mt-1">
            <div *ngIf="password?.errors?.['required']">Senha é obrigatória</div>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <input id="remember-me" name="remember-me" type="checkbox"
            class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
          <label for="remember-me" class="ml-2 block text-sm text-gray-900">
            Lembrar de mim
          </label>
        </div>

        <div class="text-sm">
          <a [routerLink]="['/forgot-password']" class="font-medium text-indigo-600 hover:text-indigo-500">
            Esqueceu sua senha?
          </a>
        </div>
      </div>

      <div *ngIf="error" class="text-red-500 text-sm text-center">
        {{ error }}
      </div>

      <div>
        <button type="submit" [disabled]="loginForm.invalid || isLoading"
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="!isLoading">Entrar</span>
          <span *ngIf="isLoading">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </span>
        </button>
      </div>
    </form>

    <div class="mt-6">
      <div class="relative">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-300"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-2 bg-gray-50 text-gray-500">Ou continue com</span>
        </div>
      </div>

      <div class="mt-6">
        <button (click)="loginWithGoogle()" type="button"
          class="w-full flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50">
          <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
            <g transform="matrix(1, 0, 0, 1, 27.009001, -39.238998)">
              <path fill="#4285F4" d="M -3.264 51.509 C -3.264 50.719 -3.334 49.969 -3.454 49.239 L -14.754 49.239 L -14.754 53.749 L -8.28426 53.749 C -8.52426 55.229 -9.21651 56.479 -10.0802 57.329 L -10.0735 60.524 L -6.326 60.524 C -3.173 57.649 -3.264 53.054 -3.264 51.509 Z"/>
              <path fill="#34A853" d="M -14.754 63.239 C -11.514 63.239 -8.8045 62.159 -6.826 60.524 L -10.0735 57.329 C -11.1235 58.289 -12.5835 58.939 -14.2535 58.939 C -17.1835 58.939 -19.654 56.619 -20.4135 53.529 L -24.0715 53.529 L -24.1235 56.789 C -22.1835 60.819 -18.734 63.239 -14.754 63.239 Z"/>
              <path fill="#FBBC05" d="M -20.414 53.529 C -20.814 52.209 -21.044 50.809 -21.044 49.239 C -21.044 47.669 -20.814 46.269 -20.414 44.949 L -20.414 41.689 L -24.072 41.689 C -25.642 44.859 -26.504 48.429 -26.504 49.239 C -26.504 50.049 -25.642 53.619 -24.072 56.789 L -20.414 53.529 Z"/>
              <path fill="#EA4335" d="M -14.754 39.739 C -12.984 39.739 -11.4035 40.389 -10.0735 41.469 L -6.82601 38.329 C -8.80451 36.359 -11.514 35.239 -14.754 35.239 C -18.734 35.239 -22.184 37.659 -24.1235 41.689 L -20.4135 44.949 C -19.654 41.859 -17.184 39.739 -14.754 39.739 Z"/>
            </g>
          </svg>
          Entrar com Google
        </button>
      </div>
    </div>
  </div>
</div>
