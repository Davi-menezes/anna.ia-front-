
<div class="min-h-screen flex flex-col items-center justify-center pt-24 pb-12 px-4">
  <div class="w-full max-w-4xl text-center">
    <h1 class="text-4xl md:text-5xl font-bold text-futuristic-text dark:text-dark-text">Obtenha mais créditos</h1>
    <p class="mt-4 text-lg text-futuristic-subtext dark:text-dark-subtext">Escolha um pacote para continuar sua jornada de aprendizado.</p>

    <div class="mt-12 grid grid-cols-1 md:grid-cols-3 gap-8">
      @for (pkg of packages; track pkg.amount) {
        <div class="relative flex flex-col p-8 bg-white/60 dark:bg-slate-800/50 backdrop-blur-sm rounded-2xl shadow-lg border border-white/30 dark:border-slate-700/50 transition-all duration-300 hover:shadow-2xl hover:-translate-y-1">
          @if (pkg.popular) {
            <div class="absolute top-0 -translate-y-1/2 left-1/2 -translate-x-1/2">
              <span class="inline-flex items-center px-3 py-0.5 rounded-full text-sm font-medium bg-futuristic-secondary text-white">
                Popular
              </span>
            </div>
          }
          <div class="flex-1">
            <h3 class="text-2xl font-semibold text-futuristic-primary">{{ pkg.amount }} Créditos</h3>
            <p class="mt-4 text-futuristic-subtext dark:text-dark-subtext">{{ pkg.description }}</p>
            <div class="mt-6">
              <span class="text-4xl font-bold text-futuristic-text dark:text-dark-text">{{ pkg.price }}</span>
            </div>
          </div>
          <button (click)="buyCredits(pkg.amount)" class="mt-8 w-full py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-futuristic-primary hover:bg-futuristic-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
            Comprar Agora
          </button>
        </div>
      }
    </div>
  </div>
</div>
