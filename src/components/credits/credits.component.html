<div class="min-h-screen py-20 px-4 bg-slate-50 dark:bg-[#0a0f1e]">
  <div class="w-full max-w-6xl mx-auto text-center">
    <h1 class="text-3xl md:text-5xl font-black text-slate-900 dark:text-white mb-4">Escolha seu pacote de créditos</h1>
    <p class="text-base text-slate-500 dark:text-slate-400 mb-16">Adicione créditos para continuar usando a Anna.IA</p>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
      @for (pkg of packages; track pkg.amount) {
      <div class="relative flex flex-col h-full group">
        <!-- Badge Popular -->
        @if (pkg.popular) {
        <div class="absolute -top-3 left-0 right-0 z-30 flex justify-center">
          <span
            class="inline-block whitespace-nowrap bg-futuristic-primary text-white text-[10px] font-black uppercase tracking-[0.2em] px-5 py-2 rounded-full shadow-xl border border-white/20 transform-gpu transition-transform group-hover:scale-110">
            Mais Popular
          </span>
        </div>
        }

        <!-- Card Container -->
        <div
          class="flex-1 flex flex-col p-8 bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-3xl backdrop-blur-xl transition-all duration-300 group-hover:shadow-[0_20px_40px_rgba(0,0,0,0.1)] dark:group-hover:shadow-[0_20px_40px_rgba(0,0,0,0.4)] group-hover:border-futuristic-primary/30 h-full overflow-visible">
          <div class="flex flex-col items-center text-center h-full">
            <h3 class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-[0.3em] mb-6">
              {{ pkg.amount === 999 ? 'Acesso Ilimitado' : pkg.amount + ' Créditos' }}
            </h3>

            <div class="text-4xl font-black text-slate-900 dark:text-white mb-3">
              {{ pkg.price }}
            </div>

            <p class="text-xs text-slate-500 dark:text-slate-400 mb-10 leading-relaxed min-h-[3rem]">
              {{ pkg.description }}
            </p>

            <!-- Payment Button -->
            <div class="mt-auto w-full flex justify-center min-h-[50px]">
              <button (click)="buyCredits(pkg)"
                class="w-full max-w-[200px] h-12 bg-futuristic-primary hover:bg-futuristic-secondary text-white text-[10px] font-black uppercase tracking-[0.2em] rounded-2xl transition-all shadow-lg active:scale-95">
                {{ pkg.amount === 999 ? 'Assinar' : 'Comprar' }}
              </button>
            </div>
          </div>
        </div>
      </div>
      }
    </div>
  </div>
</div>
